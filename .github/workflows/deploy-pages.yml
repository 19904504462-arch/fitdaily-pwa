name: Deploy FitDaily to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare training images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/training/chest public/images/training/back public/images/training/legs public/images/training/shoulders

          ua="FitDaily GitHub Pages build"

          fetch_img() {
            url="$1"
            out="$2"
            echo "Downloading $out"
            curl -L --fail --retry 4 --retry-delay 2 -A "$ua" "$url" -o "$out"
            test -s "$out"
          }

          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Barbells.jpg?width=1200" "public/images/training/chest/bench-press.jpg"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Pec%20deck%20Fly.jpg?width=1000" "public/images/training/chest/pec-deck.jpg"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Chest%20flies%20with%20cable%20machine%20-%20cable%20crossover%20flies.jpg?width=1200" "public/images/training/chest/cable-fly.jpg"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Amer-Lat-Pulldown.jpg?width=1000" "public/images/training/back/lat-pulldown.jpg"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Leg-press-1-1024x670.png" "public/images/training/legs/leg-press.png"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Squats-2.png" "public/images/training/legs/squat.png"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Romanian-deadlift-1.png" "public/images/training/legs/romanian-deadlift.png"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Dumbbell-shoulder-press-1.png" "public/images/training/shoulders/shoulder-press.png"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/DumbbellLateralRaise.JPG" "public/images/training/shoulders/lateral-raise.jpg"
          fetch_img "https://commons.wikimedia.org/wiki/Special:FilePath/Cable-upright-rows-1.png" "public/images/training/shoulders/face-pull.png"

          node <<'NODE'
          const fs=require("fs");
          for (const [src,dst] of [
            ["app/training-images/seated-row.ts","public/images/training/back/seated-row.webp"],
            ["app/training-images/chest-supported-row.ts","public/images/training/back/chest-supported-row.webp"]
          ]) {
            const text=fs.readFileSync(src,"utf8");
            const match=text.match(/base64,([^"]+)/);
            if (!match) throw new Error("Missing embedded image in "+src);
            const buf=Buffer.from(match[1],"base64");
            if (buf.slice(0,4).toString()!=="RIFF" || buf.slice(8,12).toString()!=="WEBP") {
              throw new Error("Invalid WEBP in "+src);
            }
            fs.writeFileSync(dst,buf);
          }
          NODE

          echo "Prepared training images:"
          find public/images/training -type f -maxdepth 3 -printf '%p %s bytes\n'

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /fitdaily-pwa

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
